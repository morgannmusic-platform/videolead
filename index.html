<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlog Hub - Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="assets/img/logos/apple.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, rgb(146, 230, 255), rgb(213, 247, 255));
            color: #f1f5f9;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.493);
            background: linear-gradient(180deg, rgb(97, 231, 255), rgba(255, 255, 255, 0));
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 56rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon img {
            width: 40px;

        }


        .brand-title {
            font-weight: 700;
            font-size: 1.125rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #cff1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #userAuthSection {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* Main */
        main {
            max-width: 56rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            padding-top: 3rem;
            padding-bottom: 3rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* Logged Out View */
        #loggedOutView {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 28rem;
            width: 100%;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .hero-text h1 {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .hero-text p {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: #14a3db;
            color: #ffffff;
            font-weight: 500;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #6366f1;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Logged In View */
        #loggedInView {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            max-width: 28rem;
        }

        .user-card {
            padding: 1rem;
            border-radius: 24px;
            background-color: rgba(255, 255, 255, 0.527);
            border: 1px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.363);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            background-color: rgba(99, 236, 241, 0.2);
            color: #5aaee6;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(99, 189, 241, 0.3);
        }

        .user-details {
            text-align: left;
            overflow: hidden;
        }

        .user-details-subtitle {
            font-size: 0.75rem;
            color: #557fa7;
            font-weight: 500;
        }

        .user-details-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4fbfff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-logout {
            font-size: 0.75rem;
            padding: 0.375rem 0.75rem;
            background-color: #ffbcd5;
            border: 1px solid #f884a7;
            border-radius: 0.5rem;
            color: #471d28;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .nav-card {
            text-decoration: none;
            padding: 1rem;
            background-color: rgba(255, 255, 255, 0.527);
            border: 1px solid #ffffff;
            border-radius: 24px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.363);
        }




        .nav-card:hover {
            border-color: #6366f1;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1);
        }



        .nav-card-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            background-color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .nav-card:hover .nav-icon {
            transform: scale(1.05);
        }

        .nav-icon.secondary {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .nav-icon svg,
        .nav-arrow {
            width: 1.5rem;
            height: 1.5rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-card-text {
            text-align: left;
        }

        .nav-card-text h2 {
            font-weight: 600;
            font-size: 1rem;
            color: #000000;
        }

        .nav-card-text p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .nav-arrow {
            width: 1.25rem;
            height: 1.25rem;
            color: #64748b;
            transition: all 0.2s;
        }

        .nav-card:hover .nav-arrow {
            color: #818cf8;
            transform: translateX(0.25rem);
        }

        .nav-card.secondary:hover .nav-arrow {
            color: #cbd5e1;
        }

        /* Footer */
        footer {
            width: 100%;
            border-top: 1px solid rgba(116, 195, 226, 0.8);
            padding-top: 1rem;
            padding-bottom: 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Dynamic Auth Badge */
        .auth-badge {
            font-size: 0.75rem;
            font-weight: 500;
            color: #cbd5e1;
            background-color: #0f172a;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #1e293b;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .auth-badge-muted {
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <div class="brand-wrapper">
                <div class="brand-icon">
                    <img src="/assets/img/logos/icon-rnd.png" alt="Logo">
                </div>
                <span class="brand-title">VideoLead</span>
            </div>

            <div id="userAuthSection">
            </div>
        </div>
    </header>

    <main>

        <div id="loggedOutView" class="hidden">
            <div class="hero-text">
                <h1>Espace Vlog Perso</h1>
                <p>Connecte-toi via la page de connexion pour accéder à ton espace et tes flux.</p>
            </div>

            <button onclick="openLoginPopup()" class="btn-primary">
                Se connecter
            </button>
        </div>

        <div id="loggedInView" class="hidden">
            <div class="user-card">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        VF
                    </div>
                    <div class="user-details">
                        <p class="user-details-subtitle">Connecté en tant que</p>
                        <p id="userNameDisplay" class="user-details-title">Utilisateur</p>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout">
                    Se déconnecter
                </button>
            </div>

            <div class="links-grid">
                <a href="enregistrement.html" class="nav-card">
                    <div class="nav-card-left">
                        <div class="nav-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <div class="nav-card-text">
                            <h2>Enregistrement</h2>
                            <p>Filmer et envoyer sur R2</p>
                        </div>
                    </div>
                    <svg class="nav-arrow" viewBox="0 0 24 24">
                        <path d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>

                <a href="drive.html" class="nav-card secondary">
                    <div class="nav-card-left">
                        <div class="nav-icon secondary">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4">
                                </path>
                            </svg>
                        </div>
                        <div class="nav-card-text">
                            <h2>Drive / Fichiers</h2>
                            <p>Gérer et télécharger tes vidéos</p>
                        </div>
                    </div>
                    <svg class="nav-arrow" viewBox="0 0 24 24">
                        <path d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
            </div>
        </div>

    </main>

    <footer>
        VideoLead de Morgann Music Platforms. Tous doits réservés.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:bb237f4b53a92f038494a9",
            measurementId: "G-P3EJ3T9RKS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const userAuthSection = document.getElementById('userAuthSection');

        window.openLoginPopup = function () {
            const width = 450;
            const height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            window.open('login.html', 'LoginPopup', `width=${width},height=${height},top=${top},left=${left},resizable,scrollbars=yes,status=1`);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');

                const email = user.email || "Utilisateur";
                document.getElementById('userNameDisplay').textContent = email;
                document.getElementById('userAvatar').textContent = email.substring(0, 2).toUpperCase();

                userAuthSection.innerHTML = `
                    <span class="auth-badge">
                        ${email}
                    </span>
                `;
            } else {
                loggedOutView.classList.remove('hidden');
                loggedInView.classList.add('hidden');
                userAuthSection.innerHTML = `<span class="auth-badge-muted">Non connecté</span>`;
            }
        });

        window.logout = async function () {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Erreur de déconnexion", error);
            }
        };
    </script>
</body>

</html>
